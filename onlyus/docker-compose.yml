services:
  db:
    image: postgres:16
    container_name: onlyus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: onlyus
      POSTGRES_PASSWORD: onlyus
      POSTGRES_DB: onlyus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: onlyus-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://onlyus:onlyus@db:5432/onlyus
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
  uploads: {}
